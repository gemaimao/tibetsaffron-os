<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" style="background:#0b1120;border-radius:14px;border:1px solid rgba(212,160,23,0.25);font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="cGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d4a017"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <text x="30" y="36" fill="#f59e0b" font-size="15" font-weight="bold">西红花苷 440nm 吸光度色价标准对比 (No. A26SW02809)</text>
  <text x="30" y="58" fill="#94a3b8" font-size="11">依据 ISO 3632-2 国际标准 ＆ DB54/T 0245-2021 西藏地标 ｜ 重庆市食品药品检验检测研究院</text>
  
  <line x1="180" y1="90" x2="180" y2="250" stroke="#334155"/>
  
  <!-- ISO III -->
  <text x="165" y="110" fill="#94a3b8" font-size="12" text-anchor="end">ISO 三级品 (≥120)</text>
  <rect x="180" y="95" width="180" height="22" rx="4" fill="#334155"/>
  <text x="370" y="111" fill="#64748b" font-size="11">120</text>
  
  <!-- ISO II -->
  <text x="165" y="150" fill="#94a3b8" font-size="12" text-anchor="end">ISO 二级品 (≥170)</text>
  <rect x="180" y="135" width="255" height="22" rx="4" fill="#475569"/>
  <text x="445" y="151" fill="#94a3b8" font-size="11">170</text>
  
  <!-- ISO I & 地标一级 -->
  <text x="165" y="190" fill="#e2e8f0" font-size="12" text-anchor="end">ISO 一级 / 地标一级 (≥200)</text>
  <rect x="180" y="175" width="300" height="22" rx="4" fill="#1e3a8a"/>
  <text x="490" y="191" fill="#60a5fa" font-size="11">200</text>
  
  <!-- 天旺实测 -->
  <text x="165" y="230" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="end">天旺实测 (246)</text>
  <rect x="180" y="215" width="369" height="26" rx="4" fill="url(#cGrad)"/>
  <text x="560" y="233" fill="#fbbf24" font-size="13" font-weight="bold">246 (特级超越)</text>
  
  <rect x="30" y="275" width="620" height="30" rx="6" fill="rgba(212,160,23,0.1)" stroke="rgba(212,160,23,0.2)"/>
  <text x="45" y="294" fill="#e8c766" font-size="11">★ 结论：天旺西藏特级藏红花色价达到 246，超越 ISO 一级品标准 23%，次生代谢 Crocin 富集显著。</text>
</svg>