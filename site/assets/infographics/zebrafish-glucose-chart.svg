<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" style="background:#0b1120;border-radius:14px;border:1px solid rgba(212,160,23,0.25);font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="gGrad1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
    <linearGradient id="gGrad2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="gGrad3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  </defs>
  <text x="30" y="36" fill="#f59e0b" font-size="15" font-weight="bold">斑马鱼高糖生物模型 · 组织液葡萄糖降低实验 (FFZ202501145)</text>
  <text x="30" y="58" fill="#94a3b8" font-size="11">国家标准 GB/T 39649-2020 斑马鱼生物模型 ｜ 测试机构：苏州飞凡检测 ｜ 证书：14766127</text>
  
  <!-- Y Axis Grid -->
  <line x1="60" y1="80" x2="620" y2="80" stroke="#1e293b" stroke-dasharray="4"/>
  <text x="45" y="84" fill="#64748b" font-size="10" text-anchor="end">100%</text>
  <line x1="60" y1="140" x2="620" y2="140" stroke="#1e293b" stroke-dasharray="4"/>
  <text x="45" y="144" fill="#64748b" font-size="10" text-anchor="end">60%</text>
  <line x1="60" y1="200" x2="620" y2="200" stroke="#1e293b" stroke-dasharray="4"/>
  <text x="45" y="204" fill="#64748b" font-size="10" text-anchor="end">30%</text>
  <line x1="60" y1="260" x2="620" y2="260" stroke="#334155"/>
  <text x="45" y="264" fill="#64748b" font-size="10" text-anchor="end">0%</text>
  
  <!-- Bars -->
  <!-- 正常对照组 -->
  <rect x="110" y="180" width="80" height="80" rx="6" fill="url(#gGrad3)"/>
  <text x="150" y="170" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">正常基线</text>
  <text x="150" y="284" fill="#cbd5e1" font-size="11" text-anchor="middle">正常对照组</text>
  
  <!-- 高糖模型组 -->
  <rect x="260" y="80" width="80" height="180" rx="6" fill="url(#gGrad1)"/>
  <text x="300" y="72" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">100% (高糖)</text>
  <text x="300" y="284" fill="#cbd5e1" font-size="11" text-anchor="middle">高糖造模组</text>
  
  <!-- 天旺多糖处理组 -->
  <rect x="410" y="140" width="90" height="120" rx="6" fill="url(#gGrad2)"/>
  <text x="455" y="128" fill="#6ee7b7" font-size="13" font-weight="bold" text-anchor="middle">降低 66.74%</text>
  <text x="455" y="284" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">天旺多糖 (2000μg/mL)</text>
  <text x="455" y="300" fill="#10b981" font-size="10" text-anchor="middle">P &lt; 0.001 (极显著)</text>
  
  <!-- 注释与红线 -->
  <rect x="30" y="312" width="620" height="20" rx="4" fill="rgba(0,0,0,0.4)"/>
  <text x="40" y="326" fill="#94a3b8" font-size="9.5">* 科学说明：数据源自斑马鱼生物模型实验科研测试（FFZ202501145），属于原料活性评价，不代表人体临床治疗功效。</text>
</svg>