<svg viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" style="background:#0b1120;border-radius:14px;border:1px solid rgba(212,160,23,0.25);font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="uGrad1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
    <linearGradient id="uGrad2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="uGrad3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#7e22ce"/></linearGradient>
  </defs>
  <text x="30" y="36" fill="#f59e0b" font-size="15" font-weight="bold">斑马鱼高尿酸模型 · 尿酸抑制实验 (FFZ202501144)</text>
  <text x="30" y="58" fill="#94a3b8" font-size="11">氧嗪酸钾+黄嘌呤诱导高尿酸 ｜ 测试机构：苏州飞凡检测 ｜ 证书：83942872</text>
  
  <line x1="60" y1="80" x2="620" y2="80" stroke="#1e293b" stroke-dasharray="4"/>
  <text x="45" y="84" fill="#64748b" font-size="10" text-anchor="end">100%</text>
  <line x1="60" y1="140" x2="620" y2="140" stroke="#1e293b" stroke-dasharray="4"/>
  <text x="45" y="144" fill="#64748b" font-size="10" text-anchor="end">50%</text>
  <line x1="60" y1="200" x2="620" y2="200" stroke="#1e293b" stroke-dasharray="4"/>
  <text x="45" y="204" fill="#64748b" font-size="10" text-anchor="end">20%</text>
  <line x1="60" y1="260" x2="620" y2="260" stroke="#334155"/>
  <text x="45" y="264" fill="#64748b" font-size="10" text-anchor="end">0%</text>
  
  <!-- 高尿酸模型组 -->
  <rect x="120" y="80" width="80" height="180" rx="6" fill="url(#uGrad1)"/>
  <text x="160" y="72" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">100% (高尿酸)</text>
  <text x="160" y="284" fill="#cbd5e1" font-size="11" text-anchor="middle">高尿酸模型组</text>
  
  <!-- 阳性药对照 (别嘌呤醇) -->
  <rect x="270" y="110" width="80" height="150" rx="6" fill="url(#uGrad3)"/>
  <text x="310" y="102" fill="#d8b4fe" font-size="12" font-weight="bold" text-anchor="middle">阳性对照</text>
  <text x="310" y="284" fill="#cbd5e1" font-size="11" text-anchor="middle">别嘌呤醇 (对照)</text>
  
  <!-- 天旺多酚处理组 -->
  <rect x="420" y="94" width="90" height="166" rx="6" fill="url(#uGrad2)"/>
  <text x="465" y="86" fill="#7dd3fc" font-size="13" font-weight="bold" text-anchor="middle">减少 7.07%</text>
  <text x="465" y="284" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">天旺多酚 (2000μg/mL)</text>
  <text x="465" y="300" fill="#38bdf8" font-size="10" text-anchor="middle">P = 0.00705 &lt; 0.01 (显著)</text>
  
  <rect x="30" y="312" width="620" height="20" rx="4" fill="rgba(0,0,0,0.4)"/>
  <text x="40" y="326" fill="#94a3b8" font-size="9.5">* 科学说明：数据源自斑马鱼模型实验（FFZ202501144），属食品活性科研测试，严禁作为痛风临床治疗宣称。</text>
</svg>